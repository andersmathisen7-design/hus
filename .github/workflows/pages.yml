name: Publiser nettside

# Publiserer innholdet i site/ til grenen gh-pages, som GitHub Pages serverer.
# Kjører bare fra standardgrenen, uansett hva den heter.
on:
  push:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publiser site/ til gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tree=$(git rev-parse HEAD:site)
          commit=$(git commit-tree "$tree" -m "Publiser ${GITHUB_SHA::7}")
          git push --force origin "$commit:refs/heads/gh-pages"
